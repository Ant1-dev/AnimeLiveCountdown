<div class="section-header">
    <h2 class="section-title">What's Hot Right Now?</h2>
    <div class="gradient-bar"></div>
</div>

<!-- A plain @if (not @defer) so the cards are in the server-rendered HTML; a deferred block only
     rendered its placeholder on the server and the cards popped in later, shifting the page. -->
@if (media().length) {
    <div class="cardContainer">
        @for (show of media(); track show.id) {
            <app-show [media]="show" />
        }
    </div>
} @else {
    <app-media-skeleton />
}
