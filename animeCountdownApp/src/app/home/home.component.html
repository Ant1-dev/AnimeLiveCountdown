<div class="main-content">
  <app-hero-carousel class="carousel"/>
  <div class="main">
    <header class="page-intro">
      <h1>Anime airing schedule &amp; live episode countdowns</h1>
      <p>Every new episode this week, counted down to the minute in your time zone.</p>
    </header>
    <app-live-banner />
    <!-- Rendered on the server (crawlers and first paint get it) and hydrated in place straight away,
         while its code still loads as a separate chunk. Returning signed-in visitors get "My Schedule"
         swapped in once their session is restored. -->
    @defer (on immediate; hydrate on immediate) {
      <app-home-feed />
    }
    <nav class="browse-days" aria-labelledby="browse-days-heading">
      <h2 id="browse-days-heading">Anime schedule by day</h2>
      <ul>
        @for (day of days; track day) {
        <li><a [routerLink]="['/schedule', day]">{{ label(day) }}</a></li>
        }
        <li><a routerLink="/seasons">This season</a></li>
        <li><a routerLink="/most-hyped">Most hyped</a></li>
      </ul>
    </nav>
  </div>
  <!-- sidebar  -->
  <app-sidebar />
</div>
