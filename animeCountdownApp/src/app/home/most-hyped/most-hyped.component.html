@if (entries().length > 0) {
<section [attr.aria-labelledby]="showHeading() ? 'most-hyped-heading' : null">
  @if (showHeading()) {
  <div class="section-header">
    <h2 id="most-hyped-heading" class="section-title">Most Hyped This Week</h2>
    <div class="gradient-bar"></div>
  </div>
  }
  <div class="cardContainer">
    @for (entry of entries(); track entry.media.id; let i = $index) {
    <div class="hype-item">
      <app-show [media]="entry.media" [showAiringNow]="true" />
      <p class="hype-caption"><span class="rank">#{{ i + 1 }}</span> {{ caption(entry) }}</p>
    </div>
    }
  </div>
</section>
}
