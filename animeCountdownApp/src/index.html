      // Set the theme before first paint so there's no flash (ThemeService takes over after boot).
      (function () {
        var theme;
        try { theme = localStorage.getItem('alc-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          try { theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
          catch (e) { theme = 'dark'; }
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
