name: Deploy Backend to Oracle Cloud

on:
  push:
    branches: [ main ]
    paths:
      - 'animeCountdownBackend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    # ARM runner so the image is built for the Oracle Ampere A1 (arm64) VM
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      working-directory: ./animeCountdownBackend
      run: mvn clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract version from pom.xml
      id: version
      working-directory: ./animeCountdownBackend
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build and push Docker image
      working-directory: ./animeCountdownBackend
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        docker build -t $DOCKER_USERNAME/$IMAGE_NAME:$VERSION .
        docker tag $DOCKER_USERNAME/$IMAGE_NAME:$VERSION $DOCKER_USERNAME/$IMAGE_NAME:latest
        docker push $DOCKER_USERNAME/$IMAGE_NAME:$VERSION
        docker push $DOCKER_USERNAME/$IMAGE_NAME:latest

    - name: Deploy to Oracle Cloud VM
      uses: appleboy/ssh-action@v1.0.3
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ${{ secrets.ORACLE_USERNAME }}
        key: ${{ secrets.ORACLE_SSH_KEY }}
        envs: DOCKER_USERNAME,IMAGE_NAME
        script: |
          # Stop and remove existing container
          docker stop anime-countdown || true
          docker rm anime-countdown || true

          # Remove old images to save space
          docker image prune -af

          # Pull latest image
          docker pull $DOCKER_USERNAME/$IMAGE_NAME:latest

          # Run new container
          docker run -d \
            --name anime-countdown \
            --network host \
            --env-file /home/ubuntu/AnimeLiveCountdown/.env \
            --restart unless-stopped \
            $DOCKER_USERNAME/$IMAGE_NAME:latest

          # Show logs
          docker logs anime-countdown --tail 50
